 <!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BaghVeda Admin Dashboard</title>
    <style>
        :root {
            --primary: #1b4332;
            --accent: #2d6a4f;
            --bg: #081c15;
            --card-bg: #112a20;
            --text: #e8f5e9;
            --gold: #d4af37;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 15px; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box; }
        .container { width: 100%; max-width: 500px; background: var(--card-bg); padding: 25px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid rgba(212, 175, 55, 0.2); box-sizing: border-box; }
        h1, h2, h3 { text-align: center; color: var(--gold); margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 14px; }
        input { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #2d6a4f; background: #081c15; color: #fff; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 12px; background: var(--gold); color: #000; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #b89628; }
        #login-box, #dashboard { display: none; }
        .card { background: rgba(255, 255, 255, 0.05); padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid rgba(255, 255, 255, 0.1); }
        .price-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
        .error { color: #ff6b6b; text-align: center; font-size: 14px; margin-top: 10px; }
        .order-item { background: #081c15; padding: 12px; border-radius: 8px; margin-bottom: 12px; border-left: 4px solid var(--gold); }
        .order-item p { margin: 5px 0; font-size: 14px; }
        .item-list { background: rgba(255,255,255,0.05); padding: 8px; border-radius: 6px; margin: 6px 0; font-size: 13px; }
    </style>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

<div class="container">
    <div id="login-box">
        <h1>🔒 BaghVeda Admin</h1>
        <div class="form-group"><label>ईमेल आईडी</label><input type="email" id="email" placeholder="support@baghveda.in"></div>
        <div class="form-group"><label>पासवर्ड</label><input type="password" id="password" placeholder="पासवर्ड दर्ज करें"></div>
        <button onclick="login()">डैशबोर्ड खोलें</button>
        <p id="err" class="error"></p>
    </div>

    <div id="dashboard">
        <h2>🌿 Admin Dashboard</h2>
        
        <div class="card">
            <h3>💰 उत्पाद कीमतें व डिस्काउंट प्रबंधित करें</h3>
            <div class="price-grid">
                <div class="form-group"><label>1 KG (₹)</label><input type="number" id="p1kg" value="179"></div>
                <div class="form-group"><label>2 KG (₹)</label><input type="number" id="p2kg" value="249"></div>
                <div class="form-group"><label>3 KG (₹)</label><input type="number" id="p3kg" value="359"></div>
            </div>
            <div class="form-group" style="margin-top: 10px;">
                <label>कूपन डिस्काउंट (%) (जैसे 25 का मतलब 25% छूट)</label>
                <input type="number" id="pdisc" value="25">
            </div>
            <button onclick="saveSettings()" style="margin-top: 5px;">बदलाव सेव करें</button>
        </div>

        <div class="card">
            <h3>📦 ग्राहक ऑर्डर्स (Live Orders)</h3>
            <div id="orders-container"><p style="text-align: center; color: #888;">ऑर्डर्स लोड हो रहे हैं...</p></div>
        </div>

        <button onclick="logout()" style="background: #e63946; color: white;">लॉगआउट करें</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyACkgbFe5wwhtMumbJiTCP1iEJPKtp0SpA",
        authDomain: "baghveda.firebaseapp.com",
        projectId: "baghveda",
        storageBucket: "baghveda.firebasestorage.app",
        messagingSenderId: "337745712170",
        appId: "1:337745712170:web:ef2f4e2defe2cde4245f53"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    auth.onAuthStateChanged((user) => {
        if (user) {
            document.getElementById('login-box').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            document.querySelector('.container').style.maxWidth = '800px';
            loadSettings();
            loadOrders();
        } else {
            document.getElementById('login-box').style.display = 'block';
            document.getElementById('dashboard').style.display = 'none';
            document.querySelector('.container').style.maxWidth = '450px';
        }
    });

    function login() {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        document.getElementById('err').innerText = "";
        auth.signInWithEmailAndPassword(email, password).catch((e) => {
            document.getElementById('err').innerText = "लॉगिन असफल: " + e.message;
        });
    }

    function logout() { auth.signOut().then(() => location.reload()); }

    function saveSettings() {
        const kg1 = document.getElementById('p1kg').value;
        const kg2 = document.getElementById('p2kg').value;
        const kg3 = document.getElementById('p3kg').value;
        const discountPercent = document.getElementById('pdisc').value;

        db.collection("settings").doc("pricing").set({
            kg1, kg2, kg3, discountPercent: Number(discountPercent)
        })
        .then(() => alert("कीमतें और डिस्काउंट सफलतापूर्वक अपडेट हो गए!"))
        .catch((e) => alert("एरर: " + e.message));
    }

    function loadSettings() {
        db.collection("settings").doc("pricing").get().then((doc) => {
            if (doc.exists) {
                const data = doc.data();
                if(data.kg1) document.getElementById('p1kg').value = data.kg1;
                if(data.kg2) document.getElementById('p2kg').value = data.kg2;
                if(data.kg3) document.getElementById('p3kg').value = data.kg3;
                if(data.discountPercent !== undefined) document.getElementById('pdisc').value = data.discountPercent;
            }
        });
    }

    function loadOrders() {
        const container = document.getElementById('orders-container');
        db.collection("orders").onSnapshot((snapshot) => {
            if (snapshot.empty) {
                container.innerHTML = '<p style="text-align: center; color: #888;">कोई नया ऑर्डर नहीं मिला है।</p>';
                return;
            }
            let html = "";
            snapshot.forEach((doc) => {
                const order = doc.data();
                const name = order.customerName || 'N/A';
                const phone = order.customerPhone || 'N/A';
                const address = order.customerAddress || 'N/A';
                const amount = order.totalAmount ? `₹${order.totalAmount}` : 'N/A';
                
                let itemsListHtml = "";
                if (order.items && Array.isArray(order.items)) {
                    itemsListHtml = order.items.map(i => `<div>• <strong>${i.name}</strong> (मात्रा: ${i.qty})</div>`).join("");
                }

                html += `
                    <div class="order-item">
                        <p><strong>👤 ग्राहक नाम:</strong> ${name}</p>
                        <p><strong>📞 मोबाइल:</strong> ${phone}</p>
                        <p><strong>📍 डिलीवरी पता:</strong> ${address}</p>
                        <p><strong>🛍️ सामान:</strong></p>
                        <div class="item-list">${itemsListHtml}</div>
                        <p><strong>💰 राशि:</strong> ${amount}</p>
                        <button onclick="deleteOrder('${doc.id}')" style="background: #e63946; color: white; padding: 8px; margin-top: 8px; font-size: 13px;">✓ ऑर्डर पूरा हुआ (Delete)</button>
                    </div>
                `;
            });
            container.innerHTML = html;
        });
    }

    function deleteOrder(id) {
        if(confirm("क्या यह ऑर्डर पूरा हो गया है?")) {
            db.collection("orders").doc(id).delete().then(() => alert("ऑर्डर हटा दिया गया है।"));
        }
    }
</script>

</body>
</html>
