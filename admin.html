 <!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BaghVeda Admin</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #081c15;
            color: #e8f5e9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .box {
            background: #112a20;
            padding: 30px;
            border-radius: 10px;
            border: 1px solid #d4af37;
            width: 100%;
            max-width: 400px;
        }
        h2 { text-align: center; color: #d4af37; margin-top: 0; }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background: #081c15;
            border: 1px solid #2d6a4f;
            color: white;
            box-sizing: border-box;
            border-radius: 5px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #d4af37;
            color: black;
            border: none;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
        .error { color: #ff6b6b; text-align: center; font-size: 14px; }
    </style>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>
<body>

<div class="box" id="login-box">
    <h2>🔒 BaghVeda Admin</h2>
    <input type="email" id="email" placeholder="ईमेल आईडी दर्ज करें">
    <input type="password" id="password" placeholder="पासवर्ड दर्ज करें">
    <button onclick="login()">لॉगिन करें</button>
    <p id="err" class="error"></p>
</div>

<div class="box" id="dashboard" style="display:none;">
    <h2>🌿 स्वागत है एडमिन!</h2>
    <p>डैशबोर्ड सफलतापूर्वक खुल गया है।</p>
    <button onclick="logout()" style="background: #e63946; color: white;">लॉगआउट करें</button>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyACkgbFe5wwhtMumbJiTCP1iEJPKtp0SpA",
        authDomain: "baghveda.firebaseapp.com",
        projectId: "baghveda",
        storageBucket: "baghveda.firebasestorage.app",
        messagingSenderId: "337745712170",
        appId: "1:337745712170:web:ef2f4e2defe2cde4245f53"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    function login() {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const err = document.getElementById('err');
        err.innerText = "";

        auth.signInWithEmailAndPassword(email, password)
            .then(() => {
                document.getElementById('login-box').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
            })
            .catch((error) => {
                err.innerText = "एरर: " + error.message;
            });
    }

    function logout() {
        auth.signOut().then(() => {
            location.reload();
        });
    }
</script>

</body>
</html>
